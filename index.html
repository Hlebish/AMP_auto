<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMP Auto — подбор автозапчастей</title>
<meta name="description" content="Подбор автозапчастей по автомобилю, артикулу, OEM и названию. Склад и товары под заказ.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.svg">
</head>
<body>
<header class="header">
  <div class="brand"><div class="logo-mark">AMP<span>Auto</span></div><small>Складской подбор</small></div>
  <div class="header-actions">
    <button id="themeBtn" class="icon-btn" title="Тёмная тема">☾</button></div>
</header>

<main>
<section class="hero">
  <div>
    <span class="eyebrow">AMP AUTO</span>
    <h1>Найди деталь.</h1>
    <p>Поиск по артикулу, OEM, марке, модели, двигателю или названию. Показываем товары со склада и под заказ.</p>
  </div>
  <div class="search-box">
    <div class="tabs">
      <button class="tab active" data-mode="parts">🔎 Деталь</button>
      <button class="tab" data-mode="car">🚗 По автомобилю</button>
    </div>
    <div id="partsMode" class="mode">
      <input id="search" autocomplete="off" placeholder="BMW, APMZ0316, 622544633R, бампер…">
      <button id="searchBtn" class="primary">Найти</button>
    </div>
    <div id="carMode" class="mode hidden">
      <select id="brand"><option value="">Марка</option></select>
      <select id="model"><option value="">Модель</option></select>
      <select id="engine"><option value="">Двигатель</option></select>
      <button id="carBtn" class="primary">Подобрать</button>
    </div>
    <div class="hint">Можно писать на русском, украинском или английском. Артикулы ищутся строго.</div>
  </div>
</section>


<section class="results-section">
  <div class="section-head"><div><span class="eyebrow">РЕЗУЛЬТАТЫ</span><h2 id="resultTitle">Каталог склада</h2></div><button id="clearBtn" class="secondary">Очистить</button></div>
  <div id="results" class="results"></div>
</section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js?v=20261006-6"></script>
<script src="search-fix.js?v=20261006-6"></script>
  <script src="catalog-loader.js?v=20261006-6"></script>
</body>
</html>
